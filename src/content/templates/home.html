<script>
(function () {
  const openButton = document.getElementById('libro-open');
  const dialog = document.getElementById('libro-dialog');
  const panel = dialog?.querySelector('[data-libro-panel]');
  const closeButton = document.getElementById('libro-close');
  const dismissButton = document.getElementById('libro-dismiss');
  if (!openButton || !dialog || !panel || !closeButton || !dismissButton) return;
  let previousFocus = null;
  let previousOverflow = '';
  const focusables = () => Array.from(dialog.querySelectorAll('a[href],button:not([disabled])'));
  function closeDialog() {
    dialog.hidden = true;
    dialog.style.display = 'none';
    dialog.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = previousOverflow;
    (previousFocus || openButton).focus();
  }
  openButton.addEventListener('click', () => {
    previousFocus = document.activeElement;
    previousOverflow = document.body.style.overflow;
    dialog.hidden = false;
    dialog.style.display = 'flex';
    dialog.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeButton.focus();
  });
  closeButton.addEventListener('click', closeDialog);
  dismissButton.addEventListener('click', closeDialog);
  dialog.addEventListener('click', event => { if (event.target === dialog) closeDialog(); });
  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); closeDialog(); }
    if (event.key !== 'Tab') return;
    const items = focusables();
    if (!items.length) { event.preventDefault(); panel.focus(); return; }
    const first = items[0], last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
})();
</script>

<script>
  // Tooltips para os ícones de tecnologia
  document.querySelectorAll('.tool-icon').forEach(icon => {
    const tooltip = document.createElement('div');
    tooltip.innerText = icon.dataset.label;
    tooltip.className = 'absolute bg-yellow-600 bg-opacity-30 backdrop-blur-sm text-yellow-300 text-xs px-2 py-1 rounded-lg shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none';

    const wrapper = document.createElement('div');
    wrapper.className = 'relative group inline-block';
    icon.parentNode.insertBefore(wrapper, icon);
    wrapper.appendChild(icon);
    wrapper.appendChild(tooltip);

    wrapper.addEventListener('mouseenter', () => {
      tooltip.classList.add('opacity-100');
      tooltip.style.bottom = icon.offsetHeight + 8 + 'px';
      tooltip.style.left = '50%';
      tooltip.style.transform = 'translateX(-50%)';
    });
    wrapper.addEventListener('mouseleave', () => {
      tooltip.classList.remove('opacity-100');
    });
  });

  // Tooltips para as bandeirinhas
  document.querySelectorAll('.flag-icon').forEach(icon => {

</script>
<script>
  (function () {
    const btn = document.getElementById('navToggle');
    const desktopMenu = document.getElementById('navMenu');
    const mobileMenu = document.getElementById('navMenuMobile');

    // Garante estado inicial correto
    desktopMenu.classList.add('hidden'); // escondido em < md
    if (window.matchMedia('(min-width: 768px)').matches) {
      desktopMenu.classList.remove('hidden'); // visível em md+
      mobileMenu.classList.add('hidden');
    }

    btn.addEventListener('click', () => {
      const expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      mobileMenu.classList.toggle('hidden');
    });

    // Fecha o menu ao clicar em um link no mobile
    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      });
    });

    // Sincroniza ao redimensionar (ex.: girar o celular)
    window.addEventListener('resize', () => {
      if (window.matchMedia('(min-width: 768px)').matches) {
        desktopMenu.classList.remove('hidden');
        mobileMenu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      } else {
        desktopMenu.classList.add('hidden');
      }
    });
  })();
</script>
